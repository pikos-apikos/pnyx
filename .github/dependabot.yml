version: 2
updates:
  - package-ecosystem: gradle
    directory: /demo
    schedule:
      interval: monthly
    open-pull-requests-limit: 5
    labels:
      - dependencies
      - java

  - package-ecosystem: npm
    directory: /demo/e2e
    schedule:
      interval: monthly
    open-pull-requests-limit: 5
    labels:
      - dependencies
      - e2e

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 5
    labels:
      - dependencies
      - ci
