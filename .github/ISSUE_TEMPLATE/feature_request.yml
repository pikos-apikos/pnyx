name: Feature request
description: Propose a capability within the existing protocol and architecture
title: "[Feature]: "
labels:
  - enhancement
body:
  - type: textarea
    id: problem
    attributes:
      label: Public or developer problem
      description: Start with the current problem rather than the desired implementation.
    validations:
      required: true
  - type: textarea
    id: affected
    attributes:
      label: Who or what is affected?
      description: Citizens, communities, maintainers, operators, APIs, public artifacts, or infrastructure.
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Evidence or examples
      description: Add sources, examples, observed failures, or comparable systems.
  - type: textarea
    id: proposal
    attributes:
      label: Possible response
      description: Describe a possible feature, while leaving space for alternatives.
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives and constraints
  - type: textarea
    id: success
    attributes:
      label: How will we know it helped?
      description: Define observable success, failure, or learning conditions.
    validations:
      required: true
  - type: textarea
    id: risks
    attributes:
      label: Risks and unintended consequences
      description: Include privacy, security, accessibility, attention, capture, cost, and maintenance risks where relevant.
  - type: checkboxes
    id: scope
    attributes:
      label: Scope check
      options:
        - label: This request does not silently change a protocol or governance rule. If it does, I will use the protocol proposal form.
          required: true
        - label: I searched existing issues and documentation.
          required: true
