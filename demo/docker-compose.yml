version: "3.9"
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: pnyx
      POSTGRES_USER: pnyx
      POSTGRES_PASSWORD: pnyx_dev
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./data/public:/data/public

volumes:
  pgdata: